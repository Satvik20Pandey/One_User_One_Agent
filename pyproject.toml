[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viewer-agent"
version = "0.1.0"
description = "One User, One Agent: a per-viewer lifecycle agent with a decide, act and measure loop"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
live = ["openai>=1.0"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["viewer_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f7f9"
textColor = "#1f2328"
baseFontSize = 14

[browser]
gatherUsageStats = false

[server]
headless = true
# the pack is personal data: serve the demo on this machine only
address = "localhost"

[client]
toolbarMode = "viewer"
